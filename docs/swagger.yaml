basePath: /api/v1
definitions:
  auth.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RegisterOwnerInput:
    properties:
      business_name:
        type: string
      email:
        type: string
      owner_name:
        type: string
      password:
        type: string
    type: object
  auth.UserResponse:
    properties:
      branch_id:
        type: string
      business_id:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  branch.Branch:
    properties:
      address:
        type: string
      business_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  branch.CreateBranchInput:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  branch.UpdateBranchInput:
    properties:
      address:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  business.Business:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      service_charge_percent:
        type: number
      slug:
        type: string
      tax_percent:
        type: number
    type: object
  business.UpdateBusinessInput:
    properties:
      name:
        type: string
      service_charge_percent:
        type: number
      tax_percent:
        type: number
    type: object
  dashboard.BranchRev:
    properties:
      branch_id:
        type: string
      branch_name:
        type: string
      revenue:
        type: number
    type: object
  dashboard.CashierDashboard:
    properties:
      open_orders_count:
        type: integer
      orders_handled_today:
        type: integer
      total_collected_today:
        type: number
    type: object
  dashboard.OwnerDashboard:
    properties:
      revenue_per_branch:
        items:
          $ref: '#/definitions/dashboard.BranchRev'
        type: array
      top_menu_items:
        items:
          $ref: '#/definitions/dashboard.TopMenuItem'
        type: array
      total_orders_today:
        type: integer
      total_revenue_today:
        type: number
    type: object
  dashboard.TopMenuItem:
    properties:
      menu_item_id:
        type: string
      menu_item_name:
        type: string
      total_sold:
        type: integer
    type: object
  httputil.Error400Response:
    properties:
      error:
        example: invalid request body
        type: string
      success:
        example: false
        type: boolean
    type: object
  httputil.Error401Response:
    properties:
      error:
        example: unauthorized
        type: string
      success:
        example: false
        type: boolean
    type: object
  httputil.Error403Response:
    properties:
      error:
        example: forbidden accesss
        type: string
      success:
        example: false
        type: boolean
    type: object
  httputil.Error404Response:
    properties:
      error:
        example: resource not found
        type: string
      success:
        example: false
        type: boolean
    type: object
  httputil.Error500Response:
    properties:
      error:
        example: internal server error
        type: string
      success:
        example: false
        type: boolean
    type: object
  httputil.MessageResponse:
    properties:
      data:
        example: ok
        type: string
      success:
        example: true
        type: boolean
    type: object
  menu.CreateMenuItemInput:
    properties:
      category:
        type: string
      description:
        type: string
      is_available:
        type: boolean
      modifier_group_ids:
        items:
          type: string
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  menu.MenuItemResponse:
    properties:
      business_id:
        type: string
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_available:
        type: boolean
      modifiers:
        items:
          $ref: '#/definitions/menu.ModifierGroupResponse'
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  menu.ModifierGroupResponse:
    properties:
      id:
        type: string
      is_required:
        type: boolean
      max_select:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/menu.ModifierOptionResponse'
        type: array
    type: object
  menu.ModifierOptionResponse:
    properties:
      extra_price:
        type: number
      group_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  menu.UpdateMenuItemInput:
    properties:
      category:
        type: string
      description:
        type: string
      is_available:
        type: boolean
      modifier_group_ids:
        items:
          type: string
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  modifier.CreateModifierGroupInput:
    properties:
      is_required:
        type: boolean
      max_select:
        type: integer
      name:
        type: string
      options:
        items:
          properties:
            extra_price:
              type: number
            name:
              type: string
          type: object
        type: array
    type: object
  modifier.ModifierGroup:
    properties:
      business_id:
        type: string
      id:
        type: string
      is_required:
        type: boolean
      max_select:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/modifier.ModifierOption'
        type: array
    type: object
  modifier.ModifierOption:
    properties:
      extra_price:
        type: number
      group_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  modifier.UpdateModifierGroupInput:
    properties:
      is_required:
        type: boolean
      max_select:
        type: integer
      name:
        type: string
    type: object
  order.AddOrderItemInput:
    properties:
      menu_item_id:
        type: string
      modifier_option_ids:
        items:
          type: string
        type: array
      notes:
        type: string
      quantity:
        type: integer
    type: object
  order.CreateOrderInput:
    properties:
      branch_id:
        type: string
      customer_name:
        type: string
      table_id:
        type: string
      type:
        type: string
    type: object
  order.Order:
    properties:
      branch_id:
        type: string
      business_id:
        type: string
      cashier_id:
        type: string
      created_at:
        type: string
      customer_name:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/order.OrderItem'
        type: array
      order_number:
        type: string
      service_charge_amount:
        type: number
      status:
        type: string
      subtotal:
        type: number
      table_id:
        type: string
      tax_amount:
        type: number
      total:
        type: number
      type:
        type: string
    type: object
  order.OrderItem:
    properties:
      id:
        type: string
      menu_item_id:
        type: string
      modifiers:
        items:
          $ref: '#/definitions/order.OrderItemModifier'
        type: array
      notes:
        type: string
      order_id:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
      unit_price:
        type: number
    type: object
  order.OrderItemModifier:
    properties:
      extra_price:
        type: number
      id:
        type: string
      modifier_option_id:
        type: string
      order_item_id:
        type: string
    type: object
  order.UpdateOrderInput:
    properties:
      customer_name:
        type: string
      status:
        type: string
    type: object
  order.UpdateOrderItemInput:
    properties:
      modifier_option_ids:
        items:
          type: string
        type: array
      notes:
        type: string
      quantity:
        type: integer
    type: object
  payment.PayOrderInput:
    properties:
      amount_paid:
        type: number
      method:
        type: string
    type: object
  payment.Payment:
    properties:
      amount_paid:
        type: number
      change_amount:
        type: number
      id:
        type: string
      method:
        type: string
      order_id:
        type: string
      paid_at:
        type: string
    type: object
  qris.GenerateQRISInput:
    properties:
      amount:
        type: integer
      branch_id:
        type: string
    type: object
  staff.CreateStaffInput:
    properties:
      branch_id:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  staff.Staff:
    properties:
      branch_id:
        type: string
      business_id:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
    type: object
  staff.UpdateStaffInput:
    properties:
      branch_id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  table.CreateTableInput:
    properties:
      branch_id:
        type: string
      name:
        type: string
      qr_code:
        type: string
    type: object
  table.ReserveTableInput:
    properties:
      note:
        type: string
    type: object
  table.Table:
    properties:
      branch_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      qr_code:
        type: string
      reserved_by:
        type: string
      reserved_note:
        type: string
      status:
        description: '"available", "occupied", "reserved"'
        type: string
      updated_at:
        type: string
    type: object
  table.UpdateTableInput:
    properties:
      name:
        type: string
      qr_code:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Multi-tenant POS SaaS backend
  title: Bayar.in API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return a JWT token
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revoke the current session token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Error404Response'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/register-owner:
    post:
      consumes:
      - application/json
      description: Creates a new business and an owner account atomically
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterOwnerInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      summary: Register a new business owner
      tags:
      - Auth
  /branches:
    get:
      description: Returns all branches that belong to the authenticated owner's business
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/branch.Branch'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List branches
      tags:
      - Branches
    post:
      consumes:
      - application/json
      description: Create a new branch under the authenticated owner's business
      parameters:
      - description: Branch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/branch.CreateBranchInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/branch.Branch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Create branch
      tags:
      - Branches
  /branches/{id}:
    patch:
      consumes:
      - application/json
      description: Partially update a branch's name, address, or active status
      parameters:
      - description: Branch UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/branch.UpdateBranchInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/branch.Branch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update branch
      tags:
      - Branches
  /business:
    get:
      description: Returns the authenticated owner's business profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/business.Business'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Error404Response'
      security:
      - BearerAuth: []
      summary: Get business
      tags:
      - Business
    patch:
      consumes:
      - application/json
      description: Partially update business name, tax percent, or service charge
        percent
      parameters:
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/business.UpdateBusinessInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/business.Business'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update business
      tags:
      - Business
  /dashboard/cashier:
    get:
      description: 'Returns cashier-level stats: today''s transactions, open orders,
        and revenue for this session'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dashboard.CashierDashboard'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Cashier dashboard
      tags:
      - Dashboard
  /dashboard/owner:
    get:
      description: 'Returns business-level stats: total revenue, orders, top menu
        items, and per-branch breakdown'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dashboard.OwnerDashboard'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Owner dashboard
      tags:
      - Dashboard
  /menu:
    get:
      description: List all menu items with nested modifier groups and options. Accessible
        by owner and cashier.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/menu.MenuItemResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List menu items
      tags:
      - menu
    post:
      consumes:
      - application/json
      description: Create a new menu item and optionally link modifier groups
      parameters:
      - description: Menu item payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/menu.CreateMenuItemInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/menu.MenuItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Error403Response'
      security:
      - BearerAuth: []
      summary: Create menu item
      tags:
      - menu
  /menu/{id}:
    patch:
      consumes:
      - application/json
      description: Update menu item fields and replace modifier group links
      parameters:
      - description: Menu item UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload — modifier_group_ids replaces all existing links
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/menu.UpdateMenuItemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu.MenuItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Error403Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Error404Response'
      security:
      - BearerAuth: []
      summary: Update menu item
      tags:
      - menu
  /menu/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload or replace the image for a menu item. Accepts PNG or JPG
        only (max 5MB). Returns updated menu item with image_url.
      parameters:
      - description: Menu item UUID
        in: path
        name: id
        required: true
        type: string
      - description: Menu image file (PNG or JPG, max 5MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Returns updated menu item
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid file or menu item not found
          schema:
            $ref: '#/definitions/httputil.Error400Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "403":
          description: Forbidden - owner only
          schema:
            $ref: '#/definitions/httputil.Error403Response'
      security:
      - BearerAuth: []
      summary: Upload menu item image
      tags:
      - menu
  /menu/categories:
    get:
      description: Returns the distinct list of category values currently in use.
        Automatically reflects new categories when menu items are added. Accessible
        by owner and cashier.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List menu categories
      tags:
      - menu
  /menu/search:
    get:
      description: Search menu items by name or description (case-insensitive). Optionally
        filter by category. Accessible by owner and cashier.
      parameters:
      - description: Search keyword (matches name or description)
        in: query
        name: q
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/menu.MenuItemResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Search menu items
      tags:
      - menu
  /modifiers:
    get:
      description: Returns all modifier groups (with their options) for the authenticated
        owner's business
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/modifier.ModifierGroup'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List modifier groups
      tags:
      - Modifiers
    post:
      consumes:
      - application/json
      description: Create a modifier group with options in a single transaction
      parameters:
      - description: Modifier group payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/modifier.CreateModifierGroupInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/modifier.ModifierGroup'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Create modifier group
      tags:
      - Modifiers
  /modifiers/{id}:
    patch:
      consumes:
      - application/json
      description: Partially update a modifier group's name, required flag, or max
        selections
      parameters:
      - description: Modifier group UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/modifier.UpdateModifierGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modifier.ModifierGroup'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update modifier group
      tags:
      - Modifiers
  /modifiers/search:
    get:
      description: Search modifier groups by name (case-insensitive).
      parameters:
      - description: Search keyword (matches modifier group name)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/modifier.ModifierGroup'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Error403Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Search modifier groups
      tags:
      - Modifiers
  /orders:
    get:
      description: 'Returns orders for the business. Cashiers see only their branch''s
        orders. Filter by status: open|paid|cancelled.'
      parameters:
      - description: Filter by status (open, paid, cancelled)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/order.Order'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create a new order. Type must be "dine_in" or "takeaway". table_id
        is optional.
      parameters:
      - description: Order payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Create order
      tags:
      - Orders
  /orders/{id}:
    get:
      description: Returns a single order with all its items and applied modifiers
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Error404Response'
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - Orders
    patch:
      consumes:
      - application/json
      description: Update order status or customer name. Cannot update paid or cancelled
        orders.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update order
      tags:
      - Orders
  /orders/{id}/items:
    post:
      consumes:
      - application/json
      description: Add a menu item to an open order with optional modifier options.
        Validates modifiers belong to the menu item.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: Order item payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.AddOrderItemInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/order.OrderItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Error404Response'
      security:
      - BearerAuth: []
      summary: Add item to order
      tags:
      - orders
  /orders/{id}/items/{item_id}:
    delete:
      description: Remove an item from an open order. Recalculates order totals.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: Order item UUID
        in: path
        name: item_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Delete order item
      tags:
      - Order Items
    patch:
      consumes:
      - application/json
      description: Update quantity or notes of an existing order item. Only works
        on open orders.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: Order item UUID
        in: path
        name: item_id
        required: true
        type: string
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderItemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.OrderItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update order item
      tags:
      - Order Items
  /orders/{id}/pay:
    post:
      consumes:
      - application/json
      description: Process payment for an open order. Method must be "cash", "qris",
        or "transfer". amount_paid must be >= order total. Atomically marks order
        as paid and releases table if dine_in.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: Payment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payment.PayOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payment.Payment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Pay order
      tags:
      - Payment
  /orders/{id}/receipt:
    get:
      description: Returns full receipt data for a paid order as JSON
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Receipt data
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Order not paid yet
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get receipt data
      tags:
      - receipt
  /orders/{id}/receipt/escpos:
    get:
      description: Returns raw ESC/POS byte stream for direct thermal printer sending
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw ESC/POS bytes
          schema:
            type: file
        "404":
          description: Order not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get ESC/POS receipt bytes
      tags:
      - receipt
  /orders/{id}/receipt/pdf:
    get:
      description: Generates and returns a PDF receipt for a paid order
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF receipt file
          schema:
            type: file
        "404":
          description: Order not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Download receipt PDF
      tags:
      - receipt
  /orders/search:
    get:
      description: Search orders by customer name (case-insensitive). Optionally filter
        by type (dine_in|takeaway) and status (open|paid|cancelled). Cashiers are
        scoped to their branch.
      parameters:
      - description: Search keyword (matches customer name)
        in: query
        name: q
        type: string
      - description: 'Filter by order type: dine_in or takeaway'
        in: query
        name: type
        type: string
      - description: 'Filter by status: open, paid, or cancelled'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/order.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Error403Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Search orders
      tags:
      - Orders
  /qris/generate:
    post:
      consumes:
      - application/json
      description: Retrieves the active static QRIS for a branch, injects the transaction
        amount, recalculates CRC-16, and returns the dynamic QRIS string and QR image
        (base64 PNG). Must complete in < 200ms.
      parameters:
      - description: Branch ID and transaction amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/qris.GenerateQRISInput'
      produces:
      - application/json
      responses:
        "200":
          description: Dynamic QRIS string and image
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing amount or no active QRIS
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate dynamic QRIS
      tags:
      - qris
  /qris/history:
    get:
      description: Returns all QRIS records for a branch. Image URLs are signed Supabase
        Storage URLs (1 hour expiry).
      parameters:
      - description: Branch UUID
        in: query
        name: branch_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: QRIS history
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - owner only
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: QRIS upload history
      tags:
      - qris
  /qris/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a static QRIS image for a branch. Decodes the QR, validates
        CRC-16, stores image in Supabase Storage, saves QRIS string to DB. Deactivates
        previous QRIS for the branch.
      parameters:
      - description: QRIS image file (PNG or JPG, max 2MB)
        in: formData
        name: image
        required: true
        type: file
      - description: Branch UUID
        in: formData
        name: branch_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: QRIS uploaded and stored successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid image, invalid QRIS string, or CRC mismatch
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - owner only
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload static QRIS
      tags:
      - qris
  /staff:
    get:
      description: Returns all staff members for the authenticated owner's business
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/staff.Staff'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List staff
      tags:
      - Staff
    post:
      consumes:
      - application/json
      description: Create a new cashier account. Role is always set to "cashier".
        branch_id is required.
      parameters:
      - description: Staff payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/staff.CreateStaffInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/staff.Staff'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Create staff (cashier)
      tags:
      - Staff
  /staff/{id}:
    patch:
      consumes:
      - application/json
      description: Update a staff member's name, active status, or assigned branch.
        Cannot deactivate owner.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/staff.UpdateStaffInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/staff.Staff'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update staff
      tags:
      - Staff
  /tables:
    get:
      description: Returns all tables. Filter by branch_id query param (optional).
        Accessible by owner and cashier.
      parameters:
      - description: Branch UUID to filter tables
        in: query
        name: branch_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/table.Table'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: List tables
      tags:
      - Tables
    post:
      consumes:
      - application/json
      description: Create a new table under a branch. The branch must belong to the
        authenticated owner's business.
      parameters:
      - description: Table payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/table.CreateTableInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/table.Table'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Create table
      tags:
      - Tables
  /tables/{id}:
    patch:
      consumes:
      - application/json
      description: Partially update a table's name, status ("available"|"occupied"),
        or QR code
      parameters:
      - description: Table UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/table.UpdateTableInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/table.Table'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Error400Response'
      security:
      - BearerAuth: []
      summary: Update table
      tags:
      - Tables
  /tables/{id}/clear:
    patch:
      description: Manually set table back to available. Cannot clear if table has
        an active open order.
      parameters:
      - description: Table UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Table cleared
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Active order exists on this table
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Clear table status
      tags:
      - tables
  /tables/{id}/reserve:
    patch:
      consumes:
      - application/json
      description: Mark a table as reserved. Cannot reserve an occupied table.
      parameters:
      - description: Table UUID
        in: path
        name: id
        required: true
        type: string
      - description: Reservation note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/table.ReserveTableInput'
      produces:
      - application/json
      responses:
        "200":
          description: Table reserved
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Table is occupied
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reserve a table
      tags:
      - tables
  /tables/search:
    get:
      description: Search tables by name (case-insensitive). Optionally filter by
        branch_id and/or status. Accessible by owner and cashier.
      parameters:
      - description: Search keyword (matches table name)
        in: query
        name: q
        type: string
      - description: Branch UUID to filter tables
        in: query
        name: branch_id
        type: string
      - description: 'Filter by status: available or occupied'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/table.Table'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Error401Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Error500Response'
      security:
      - BearerAuth: []
      summary: Search tables
      tags:
      - Tables
securityDefinitions:
  BearerAuth:
    description: 'Paste your JWT token as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
